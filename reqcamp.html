<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Campaign</title>
<style>
    body {
        font-family: Arial, sans-serif;
    }
    form {
        max-width: 600px;
        margin: 0 auto;
    }
    label {
        display: block;
        margin-bottom: 5px;
    }
    .radio-container {
        display: inline-block; /* Make radio containers inline */
        margin-right: 20px; /* Add space between radio containers */
    }
    input[type="radio"] {
        vertical-align: middle; /* Align radio buttons vertically */
        margin-right: 5px;
    }
    .radio-container label {
        display: inline-block;
        vertical-align: middle; /* Align labels vertically */
        margin-bottom: 0; /* Remove bottom margin */
    }
    input, textarea, select {
        width: calc(100% - 25px); /* Adjust width to accommodate margin-right for radio buttons */
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    button {
        background-color: #e97451;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {       
       background-color: #d7603e;
    }
    h2{
        text-align: center;
    }
</style>
</head>
<body>

<h2>Request a Campaign</h2>
<form id="campaignForm" action="process_campaign.php" method="post" enctype="multipart/form-data">
    <label>Medical Emergency:</label>
    <div class="wrapper-cause">
        <div class="radio-container">
            <input type="radio" id="medicalYes" name="medical" value="yes">
            <label for="medicalYes">Yes</label>
        </div>
        <div class="radio-container">
            <input type="radio" id="medicalNo" name="medical" value="no">
            <label for="medicalNo">No</label>
        </div>
    </div>
    <br><br>

    <div class="wrapper-cause">
        <label for="causes">Cause:</label>
        <select id="causes" name="causes" required>
            <option value="">Select Cause</option>
            <option value="Education">Education</option>
            <option value="Environmental Conservation">Environmental Conservation</option>
            <option value="Community Development">Community Development</option>
            <option value="Healthcare Access">Healthcare Access</option>
            <option value="Poverty Alleviation">Poverty Alleviation</option>
            <option value="Animal Welfare">Animal Welfare</option>
            <option value="Gender Equality">Gender Equality</option>
            <option value="Disaster Relief">Disaster Relief</option>
            <option value="Human Rights">Human Rights</option>
            <!-- Add more options as needed -->
        </select>
    </div>

    <label for="details">Detailss:</label>
    <textarea id="details" name="details" rows="4" required></textarea>

    <label for="image">Upload Evidential Image:</label>
    <input type="file" id="image" name="image" accept="image/*">

    <label for="document">Upload Document:</label>
    <input type="file" id="document" name="document" accept=".pdf, .doc, .docx">

    <label for="moneyTarget">Money Target:</label>
    <input type="number" id="moneyTarget" name="moneyTarget" required>

    <button type="submit">Submit</button>
</form>

<script>
    document.getElementById('campaignForm').addEventListener('submit', function(event) {
        // Validate money target
        var moneyTarget = document.getElementById('moneyTarget').value;
        if (isNaN(moneyTarget) || moneyTarget <= 0) {
            alert('Money target must be a positive number.');
            event.preventDefault();
        }
    });
</script>

</body>
</html>

</html>
